<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dipali Saini ❤️ Valentine</title>
<style>
body {
  margin:0;
  padding:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ff6fa5,#ff3d7a);
  font-family: Arial, sans-serif;
  overflow:hidden;
}
.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding:30px;
  border-radius:20px;
  text-align:center;
  color:white;
  width:90%;
  max-width:400px;
  box-shadow:0 0 25px rgba(0,0,0,0.3);
  z-index:2;
  position:relative;
}
.card h1 { margin-bottom:10px; }
.card p { margin:20px 0; font-size:18px; }
.btn {
  padding:12px 25px;
  margin:5px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}
.yes { background:#2ecc71; color:white; }
.no { background:#e74c3c; color:white; position:absolute; }
.btn:hover { transform:scale(1.1); }

/* falling emojis */
.fall {
  position:fixed;
  top:-50px;
  font-size:28px;
  animation: fall linear infinite;
  z-index:1;
}
@keyframes fall {
  0% { top:-50px; transform: translateX(0); }
  100% { top:100vh; transform: translateX(50px); }
}

/* romantic popup message */
#messageBox {
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background: rgba(0,0,0,0.8);
  padding:30px;
  border-radius:20px;
  color:white;
  text-align:center;
  z-index:10;
}
</style>
</head>
<body>

<div class="card">
  <h1>Dipali Saini ❤️</h1>
  <p>From the moment I met you, my world became brighter ✨<br>Will you be my Valentine forever? 💍</p>
  <button class="btn yes" onclick="showMessage()">YES 💖</button>
  <button class="btn no" id="noBtn" onmouseover="moveNo()">NO 😅</button>
</div>

<div id="messageBox">
  <h2>Yayyy 💕 I knew you'd say YES!</h2>
  <p>Let's make every moment magical together! 🥰</p>
</div>

<script>
// NO button bhagta rahe
function moveNo(){
  const btn = document.getElementById('noBtn');
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';
}

// YES click
function showMessage(){
  document.getElementById('messageBox').style.display = 'block';
}

// continuous falling emojis
const emojis = ["❤️","🍫","🧸","💖","💝","🍬"];
setInterval(()=>{
  const el = document.createElement('div');
  el.className='fall';
  el.innerText = emojis[Math.floor(Math.random()*emojis.length)];
  el.style.left = Math.random()*100 + 'vw';
  el.style.fontSize = (20 + Math.random()*30) + 'px';
  el.style.animationDuration = (4 + Math.random()*3) + 's';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),7000);
}, 300);
</script>

</body>
</html>
