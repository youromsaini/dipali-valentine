<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffb6c1;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  .card {
    background: #d580a3;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    color: white;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
  .card h1 { margin: 10px 0; }
  .card p { margin: 20px 0; }
  .btn {
    padding: 12px 25px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  .yes { background: #2ecc71; color: white; }
  .no { background: #e74c3c; color: white; }
  .btn:hover { transform: scale(1.1); }
  .message {
    display: none;
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
  }
  /* Falling hearts/teddy/chocolate */
  .falling {
    position: fixed;
    top: -50px;
    font-size: 30px;
    animation: fall 5s linear infinite;
  }
  @keyframes fall {
    0% { top: -50px; transform: translateX(0); }
    100% { top: 100%; transform: translateX(50px); }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Will you be my Valentine? ❤️</h1>
  <p>From the moment I met you, my world became brighter 🌹</p>
  <button class="btn yes" onclick="showMessage(true)">YES 💖</button>
  <button class="btn no" onclick="showMessage(false)">NO 😅</button>
  <div class="message" id="message"></div>
</div>

<script>
  function showMessage(answer) {
    const msg = document.getElementById('message');
    if(answer){
      msg.innerHTML = "Yay! 💕 I knew you'd say YES! Let's make every moment magical together! 🥰";
    } else {
      msg.innerHTML = "Aww 😢, I was hoping for YES 💖. But I'll keep loving you! 🌹";
    }
    msg.style.display = "block";

    // Add falling emojis
    const emojis = ["🍫","🧸","❤️","💖","🍬"];
    for(let i=0;i<15;i++){
      const span = document.createElement('span');
      span.className = 'falling';
      span.style.left = Math.random()*100 + 'vw';
      span.style.fontSize = (20 + Math.random()*30) + 'px';
      span.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
      document.body.appendChild(span);

      // Remove after 5s
      setTimeout(()=>span.remove(),5000);
    }
  }
</script>

</body>
</html>
