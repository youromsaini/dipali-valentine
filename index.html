<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dipali ❤️ Valentine Proposal</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff4e8a, #ff9ecb);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        color: white;
        text-align: center;
    }.card {
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    max-width: 420px;
    animation: pop 0.8s ease;
}

@keyframes pop {
    from {transform: scale(0.6); opacity:0}
    to {transform: scale(1); opacity:1}
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
    margin-bottom: 30px;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.yes {
    background: #00e676;
    color: black;
}

.no {
    background: #ff1744;
    color: white;
    position: absolute;
}

button:hover {
    transform: scale(1.1);
}

.heart {
    position: absolute;
    color: #fff;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh) scale(0.5); opacity:1 }
    to { transform: translateY(-10vh) scale(1.2); opacity:0 }
}

</style>
</head>
<body><div class="card">
    <h1>Dipali Saini ❤️</h1>
    <p>From the moment I met you, my world became brighter.
    Will you be my Valentine forever? 💍</p><button class="yes" onclick="yesClick()">YES 💖</button>
<button class="no" id="noBtn" onmouseover="moveNo()">NO 😅</button>

</div><script>
function yesClick() {
    document.body.innerHTML = `
        <div style="text-align:center; color:white;">
            <h1>Yayyyy!!! ❤️🎉</h1>
            <h2>I Love You Dipali 💕</h2>
            <p>This moment is saved forever.</p>
        </div>`;
}

function moveNo() {
    const btn = document.getElementById('noBtn');
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
}

// floating hearts
setInterval(() => {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (Math.random()*3+3) + 's';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}, 300);
</script></body>
</html>
