<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dipali Saini ❤️</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ff6fa5,#ff3d7a);
  overflow:hidden;
  font-family: Arial, sans-serif;
}

/* Card */
.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding:30px;
  border-radius:20px;
  text-align:center;
  color:white;
  box-shadow:0 0 25px rgba(0,0,0,0.25);
  z-index:2;
}

h1 {
  margin-bottom:10px;
}

p {
  font-size:18px;
}

/* Buttons */
.btn {
  padding:12px 22px;
  border:none;
  border-radius:30px;
  font-size:16px;
  margin:10px;
  cursor:pointer;
}

.yes { background:#00e676; }
.no { background:#ff1744; color:white; }

/* Falling items */
.fall {
  position:fixed;
  top:-50px;
  font-size:28px;
  animation: fall linear forwards;
  z-index:1;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}
</style>
</head>

<body>

<div class="card">
  <h1>Dipali Saini ❤️</h1>
  <p>
    From the moment I met you,<br>
    my world became brighter ✨<br><br>
    Will you be my Valentine forever? 💍
  </p>

  <button class="btn yes" onclick="yesClick()">YES 💖</button>
  <button class="btn no" onclick="moveNo(this)">NO 😜</button>
</div>

<script>

/* YES click */
function yesClick(){
  alert("Yayyy 💖 Best Valentine Ever!");
}

/* NO button bhagega */
function moveNo(btn){
  btn.style.position="absolute";
  btn.style.top=Math.random()*80+"vh";
  btn.style.left=Math.random()*80+"vw";
}

/* Falling animation items */
const items = ["❤️","🍫","😙","🧸","💝","💖"];

function createFall(){
  const el = document.createElement("div");
  el.className="fall";
  el.innerText = items[Math.floor(Math.random()*items.length)];
  el.style.left = Math.random()*100 + "vw";
  el.style.animationDuration = (3+Math.random()*4)+"s";
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),7000);
}

setInterval(createFall, 300);

</script>

</body>
</html>
